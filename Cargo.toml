[workspace]
members = ["owx-vault", "owx", "owx-pay", "owx-swap", "owx-cli"]
default-members = ["owx"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/qntx/owx"
description = "Agent-native, self-custodial, policy-gated, multi-chain wallet toolkit."
keywords = ["crypto", "wallet", "bitcoin", "ethereum", "solana"]
categories = ["cryptography::cryptocurrencies"]
readme = "README.md"

[workspace.dependencies]
owx = { version = "0.6", path = "owx" }
owx-vault = { version = "0.6", path = "owx-vault" }
owx-pay = { version = "0.6", path = "owx-pay" }
owx-swap = { version = "0.6", path = "owx-swap" }

# HD derivation (10 chains)
kobe = { version = "0.7.7", default-features = false, features = ["std", "rand"] }
kobe-btc = { version = "0.7.7", default-features = false, features = ["std"] }
kobe-cosmos = { version = "0.7.7", default-features = false, features = ["std"] }
kobe-evm = { version = "0.7.7", default-features = false, features = ["std"] }
kobe-fil = { version = "0.7.7", default-features = false, features = ["std"] }
kobe-spark = { version = "0.7.7", default-features = false, features = ["std"] }
kobe-sui = { version = "0.7.7", default-features = false, features = ["std"] }
kobe-svm = { version = "0.7.7", default-features = false, features = ["std"] }
kobe-ton = { version = "0.7.7", default-features = false, features = ["std"] }
kobe-tron = { version = "0.7.7", default-features = false, features = ["std"] }
kobe-xrpl = { version = "0.7.7", default-features = false, features = ["std"] }

# Signing (umbrella)
signer = { version = "0.5.0", features = ["kobe"] }

# Crypto
aes-gcm = "0.10.3"
hkdf = "0.12.4"
scrypt = "0.11.0"
sha2 = "0.10.9"
zeroize = { version = "1.8.2", features = ["derive"] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# Encoding
hex = "0.4.3"
base64 = "0.22.1"

# HTTP
reqwest = { version = "0.13.2", features = ["json", "rustls", "blocking"], default-features = false }

# Swap
lifiswap = { version = "0.4", default-features = false }
lifiswap-evm = { version = "0.4", default-features = false }
alloy = { version = "1", default-features = false, features = ["signers", "signer-local"] }

# Constant-time comparison
subtle = "2.6"

# Utility
chrono = { version = "0.4.44", features = ["serde"] }
uuid = { version = "1.23.0", features = ["v4"] }
thiserror = "2.0.18"
clap = { version = "4.6.0", features = ["derive", "env"] }
getrandom = "0.2.16"
libc = "0.2"
signal-hook = "0.3"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

[profile.dev]
debug = true
opt-level = 0

[profile.test]
opt-level = 2

[profile.ci]
debug = false
inherits = "dev"

[profile.bench]
debug = true
inherits = "release"

[workspace.lints.rust]
elided_lifetimes_in_paths = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unsafe_code = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
clone_on_ref_ptr = "warn"
complexity = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
dbg_macro = "warn"
doc_markdown = "warn"
exhaustive_enums = "warn"
exhaustive_structs = "warn"
expect_used = "warn"
fn_params_excessive_bools = "warn"
future_not_send = "warn"
implicit_hasher = "warn"
missing_docs_in_private_items = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
module_name_repetitions = "warn"
multiple_crate_versions = "allow"
must_use_candidate = "warn"
nursery = { level = "warn", priority = -1 }
option_if_let_else = "warn"
panic = "warn"
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
print_stderr = "warn"
print_stdout = "warn"
shadow_reuse = "warn"
shadow_same = "warn"
shadow_unrelated = "warn"
significant_drop_tightening = "warn"
similar_names = "warn"
struct_excessive_bools = "warn"
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
todo = "warn"
too_many_lines = "warn"
unimplemented = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"
cargo_common_metadata = "warn"
