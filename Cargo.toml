[workspace]
members = ["owx", "owx-cli", "owx-core", "owx-pay", "owx-policy", "owx-vault"]
default-members = ["owx"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/qntx/owx"
description = "Agent-native, self-custodial, policy-gated, multi-chain wallet toolkit."
keywords = ["crypto", "wallet", "bitcoin", "ethereum", "solana"]
categories = ["cryptography::cryptocurrencies"]
readme = "README.md"

[workspace.dependencies]
# Internal crates
owx = { version = "0.2", path = "owx" }
owx-core = { version = "0.2", path = "owx-core" }
owx-vault = { version = "0.2", path = "owx-vault" }
owx-policy = { version = "0.2", path = "owx-policy" }
owx-pay = { version = "0.2", path = "owx-pay" }

# HD wallet (kobe)
kobe = { version = "0.5.4", default-features = false, features = ["std", "rand"] }
kobe-btc = { version = "0.5.4", default-features = false, features = ["std"] }
kobe-evm = { version = "0.5.4", default-features = false, features = ["std"] }
kobe-svm = { version = "0.5.4", default-features = false, features = ["std"] }

# Signing (signer)
signer = { version = "0.3.1", features = ["kobe"] }
signer-btc = { version = "0.3.1", features = ["kobe"] }
signer-evm = { version = "0.3.1", features = ["kobe"] }
signer-svm = { version = "0.3.1", features = ["kobe"] }

# x402 payment protocol
r402 = "0.12.3"
r402-evm = { version = "0.12.3", default-features = false, features = ["client"] }

# Crypto
aes-gcm = "0.10.3"
digest = "0.10.7"
hkdf = "0.12.4"
hmac = "0.12.1"
scrypt = "0.11.0"
sha2 = "0.10.9"
zeroize = { version = "1.8.2", features = ["derive"] }
rand = "0.10.0"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# Encoding
hex = "0.4.3"
base64 = "0.22.1"
bs58 = "0.5.1"

# Async / HTTP
reqwest = { version = "0.13.2", features = ["json", "rustls"], default-features = false }
tokio = { version = "1.50.0", features = ["rt-multi-thread", "macros"] }

# Utility
chrono = { version = "0.4.44", features = ["serde"] }
uuid = { version = "1.23.0", features = ["v4"] }
thiserror = "2.0.18"
clap = { version = "4.6.0", features = ["derive"] }
tempfile = "3.27.0"
getrandom = { version = "0.4.2", features = ["std"] }
libc = "0.2"
signal-hook = "0.3"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

[profile.dev]
debug = true
opt-level = 0

[profile.test]
opt-level = 2

[profile.ci]
debug = false
inherits = "dev"

[profile.bench]
debug = true
inherits = "release"

[workspace.lints.rust]
elided_lifetimes_in_paths = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unsafe_code = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
clone_on_ref_ptr = "warn"
complexity = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
dbg_macro = "warn"
doc_markdown = "allow"
exhaustive_enums = "allow"
exhaustive_structs = "allow"
expect_used = "warn"
fn_params_excessive_bools = "allow"
future_not_send = "allow"
implicit_hasher = "allow"
missing_docs_in_private_items = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
must_use_candidate = "allow"
nursery = { level = "warn", priority = -1 }
option_if_let_else = "allow"
panic = "warn"
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
print_stderr = "warn"
print_stdout = "warn"
shadow_reuse = "warn"
shadow_same = "warn"
shadow_unrelated = "warn"
significant_drop_tightening = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
todo = "warn"
too_many_lines = "allow"
unimplemented = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"
