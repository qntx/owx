[package]
name = "owx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for OWX agent wallet toolkit."
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "owx"
path = "src/main.rs"

[features]
default = ["pay", "moonpay", "swap"]
pay = ["owx-pay/x402"]
moonpay = ["owx-pay/moonpay"]
swap = ["dep:owx-swap"]

[dependencies]
owx.workspace = true
owx-pay.workspace = true
owx-swap = { workspace = true, optional = true }
clap.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "macros"] }

[lints]
workspace = true
